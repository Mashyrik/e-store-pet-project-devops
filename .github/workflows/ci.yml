name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-store
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-,format=short
            type=semver,pattern={{version}}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
    
      - name: Run Maven verification
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Run SpotBugs analysis
        run: ./mvnw -B --no-transfer-progress spotbugs:check

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
      
      - name: Build Docker image
        run: docker build --tag e-store:ci .
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: e-store:ci
          format: cyclonedx-json
          artifact-name: e-store-sbom.cyclonedx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: e-store:ci
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      
      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        env:
          DOCKER_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag e-store:ci "$tag"
            docker push "$tag"
          done <<< "$DOCKER_TAGS"
  