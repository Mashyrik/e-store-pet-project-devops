name: CI

on:
  push:

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
    
      - name: Run Maven verification
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Run SpotBugs analysis
        run: ./mvnw -B --no-transfer-progress spotbugs:check

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
      
      - name: Build Docker image
        run: docker build --tag e-store:ci .
      
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image_ref: e-store:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln_type: os,library
          severity: HIGH,CRITICAL
      
  