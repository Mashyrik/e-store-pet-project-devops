name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven verification
        run: ./mvnw -B --no-transfer-progress clean verify

  static-analysis:
    name: Run Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run SpotBugs analysis
        run: ./mvnw -B --no-transfer-progress clean compile spotbugs:check

  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  container-security:
    name: Build and Scan Container
    runs-on: ubuntu-latest
    needs:
      - tests
      - static-analysis
      - dockerfile-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag e-store:ci .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: e-store:ci
          format: cyclonedx-json
          artifact-name: e-store-sbom.cyclonedx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: e-store:ci
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Save Docker image
        if: github.event_name == 'push'
        run: docker save --output e-store-ci.tar e-store:ci

      - name: Upload Docker image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: e-store-ci-image
          path: e-store-ci.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: container-security
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: e-store-ci-image
          path: .

      - name: Load Docker image
        run: docker load --input e-store-ci.tar

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-store
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-,format=short
            type=semver,pattern={{version}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        env:
          DOCKER_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag e-store:ci "$tag"
            docker push "$tag"
          done <<< "$DOCKER_TAGS"
