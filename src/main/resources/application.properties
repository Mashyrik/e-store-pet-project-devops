# ==================== SERVER CONFIG ====================
server.port=8080
server.servlet.context-path=/

# ==================== DATABASE CONFIG ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/e_store_lab}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ==================== JPA / HIBERNATE CONFIG ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==================== SECURITY CONFIG ====================
# ?????: ??????????????? ??? ?????? ????? Security ???????!
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ==================== JWT CONFIG ====================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ==================== LOGGING ====================
logging.level.com.estore.estore=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================== APPLICATION CONFIG ====================
spring.application.name=E-Store
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=false


# ==================== DEVTOOLS (??? ??????????) ====================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# ==================== VALIDATION ====================
spring.mvc.format.date=iso
spring.jackson.date-format=com.fasterxml.jackson.databind.util.ISO8601DateFormat
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ==================== MULTIPART FILE UPLOAD ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== CACHE ====================
spring.cache.type=none

# Первоначальное создание администратора
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.username=${ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Создание тестового пользователя
app.bootstrap.test-user.enabled=${TEST_USER_ENABLED:false}
app.bootstrap.test-user.username=${TEST_USER_USERNAME:user}
app.bootstrap.test-user.email=${TEST_USER_EMAIL:user@estore.local}
app.bootstrap.test-user.password=${TEST_USER_PASSWORD:}